[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "synnax-foundation"
description = "The Python SDK of Foundation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]
dynamic = ["version"]

[tool.maturin]
python-source = "python"
module-name = "foundation._native"
profile = "wheel"
