[package]
name = "sdk-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false
doctest = false

[features]
# Test-only functions of the module.
sim = []

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py311", "extension-module"] }
sdk = { path = "../rust" }
types = { path = "../../crates/types" }

[lints]
workspace = true
