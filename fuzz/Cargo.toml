[package]
name = "fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Outside the root workspace: the targets need the pinned nightly.
[workspace]

[dependencies]
block = { path = "../crates/block" }
buffer = { path = "../crates/buffer" }
codec = { path = "../crates/codec" }
config = { path = "../crates/config" }
config-hcl = { path = "../crates/config-hcl" }
connector-modbus = { path = "../crates/connector-modbus" }
crc32c = "0.6.8"
document = { path = "../crates/document" }
env = { path = "../crates/env" }
libfuzzer-sys = "0.4.13"
mesh = { path = "../crates/mesh", features = ["sim"] }
ops = { path = "../crates/ops" }
secret = { path = "../crates/secret" }
sim = { path = "../crates/sim" }
spec = { path = "../crates/spec" }
transport = { path = "../crates/transport", features = ["fuzzing"] }
types = { path = "../crates/types" }
wire = { path = "../crates/wire" }

[[bin]]
name = "buffer_open"
path = "fuzz_targets/buffer_open.rs"
test = false
doc = false
bench = false

