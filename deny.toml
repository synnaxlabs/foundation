# cargo-deny policy. Every third-party crate also needs an entry in
# docs/dependencies.md.

[graph]
all-features = true

[advisories]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  # `finl_unicode`, under `comrak` (docs/dependencies.md).
  "Unicode-DFS-2016",
  "Zlib",
  # `libfuzzer-sys` (docs/dependencies.md).
  "NCSA",
]
unused-allowed-license = "allow"

# Workspace crates set `publish = false` and have no license.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between workspace crates have no version.
allow-wildcard-paths = true
# Each entry gives the docs/dependencies.md decision that it enforces.
deny = [
  { crate = "openssl", reason = "aws-lc-rs is the only crypto provider" },
  { crate = "openssl-sys", reason = "aws-lc-rs is the only crypto provider" },
  # The version requirement passes the workspace crate `ring` 0.0.0.
  { crate = "ring:>=0.1", reason = "aws-lc-rs is the only crypto provider" },
  # `terminal_size` comes in through `clap`, which the `divan` benchmarks use.
  { crate = "rustix", wrappers = ["os", "terminal_size"], reason = "only os uses it" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
