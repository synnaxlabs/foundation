# A stand-in for crates.io, so the graphs resolve offline.
[source.crates-io]
replace-with = "vendor"

[source.vendor]
directory = "vendor"

# A stand-in for a git source, for the case `git`.
[source."git+https://github.com/synnaxlabs/p"]
git = "https://github.com/synnaxlabs/p"
replace-with = "vendor"
