allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
too-many-lines-threshold = 70
# Tune on a Pi 4.
stack-size-threshold = 65536

# Clock, randomness, threads, disk, network, and the environment come from `env`.
# Only `os` implements them. Hash order comes from `types::hash`.
disallowed-methods = [
  { path = "std::time::SystemTime::now", reason = "use the injected clock" },
  { path = "std::time::Instant::now", reason = "use the injected clock" },
  { path = "std::thread::sleep", reason = "use the injected clock" },
  { path = "std::thread::spawn", reason = "threads come from env" },
  { path = "std::env::var", reason = "configuration is an input" },
  { path = "std::env::var_os", reason = "configuration is an input" },
  { path = "std::time::Instant::elapsed", reason = "reads the OS clock" },
  { path = "std::time::SystemTime::elapsed", reason = "reads the OS clock" },
  { path = "std::thread::Builder::spawn", reason = "threads come from env" },
  { path = "std::thread::available_parallelism", reason = "core count comes from env" },
  { path = "std::env::vars", reason = "configuration is an input" },
  { path = "std::env::args", reason = "only node reads arguments" },
  { path = "std::fs::read", reason = "disk comes from env" },
  { path = "std::fs::File::open", reason = "disk comes from env" },
  { path = "std::fs::File::create", reason = "disk comes from env" },
  { path = "std::fs::OpenOptions::open", reason = "disk comes from env" },
  { path = "std::net::TcpStream::connect", reason = "network comes from env" },
  { path = "std::net::TcpListener::bind", reason = "network comes from env" },
  { path = "std::net::UdpSocket::bind", reason = "network comes from env" },
  { path = "std::process::exit", reason = "only node exits" },
  { path = "std::collections::HashMap::new", reason = "random hash order" },
  { path = "std::collections::HashMap::with_capacity", reason = "random hash order" },
  { path = "std::collections::HashSet::new", reason = "random hash order" },
  { path = "std::collections::HashSet::with_capacity", reason = "random hash order" },
  { path = "std::hash::RandomState::new", reason = "OS randomness breaks replay" },
  { path = "std::thread::park", reason = "await a future" },
  { path = "std::thread::park_timeout", reason = "await a future" },
  { path = "std::sync::Condvar::wait", reason = "await a future" },
  { path = "std::sync::Condvar::wait_while", reason = "await a future" },
  { path = "std::sync::Condvar::wait_timeout", reason = "await a future" },
  { path = "std::sync::Condvar::wait_timeout_while", reason = "await a future" },
  { path = "std::sync::Barrier::wait", reason = "await a future" },
  { path = "std::sync::mpsc::Receiver::recv", reason = "await a future" },
  { path = "std::sync::mpsc::Receiver::recv_timeout", reason = "await a future" },
  { path = "env::wall::Wall::now", reason = "only clock reads it" },
  # rustls: its default provider is a process global and its default time the OS
  # clock. `transport::tls` builds every config, with `builder_with_details`.
  { path = "rustls::ClientConfig::builder", reason = "use tls" },
  { path = "rustls::ServerConfig::builder", reason = "use tls" },
  { path = "rustls::ClientConfig::builder_with_protocol_versions", reason = "use tls" },
  { path = "rustls::ServerConfig::builder_with_protocol_versions", reason = "use tls" },
  { path = "rustls::ClientConfig::builder_with_provider", reason = "use tls" },
  { path = "rustls::ServerConfig::builder_with_provider", reason = "use tls" },
  { path = "rustls::ClientConfig::builder_with_details", reason = "use tls" },
  { path = "rustls::ServerConfig::builder_with_details", reason = "use tls" },
  { path = "rustls::client::WebPkiServerVerifier::builder", reason = "use tls" },
  { path = "rustls::server::WebPkiClientVerifier::builder", reason = "use tls" },
  { path = "rustls::crypto::CryptoProvider::install_default", reason = "use tls" },
  { path = "rustls::crypto::CryptoProvider::get_default", reason = "use tls" },
  { path = "rustls::crypto::aws_lc_rs::Ticketer::new", reason = "reads the OS clock" },
  { path = "rustls::TicketRotator::new", reason = "reads the OS clock" },
  { path = "rustls::TicketSwitcher::new", reason = "reads the OS clock" },
  { path = "rustls::pki_types::UnixTime::now", reason = "use the injected clock" },
  { path = "rustls::KeyLogFile::new", reason = "configuration is an input" },
]
disallowed-types = [
  { path = "std::collections::HashMap", reason = "use types::hash::Map" },
  { path = "std::collections::HashSet", reason = "use types::hash::Set" },
  { path = "std::hash::RandomState", reason = "OS randomness breaks replay" },
]
disallowed-macros = [
  { path = "std::thread_local", reason = "no mutable globals" },
  { path = "std::prelude::v1::global_allocator", reason = "only a test or benchmark root lifts this (COUNTING ALLOCATOR)" },
]

doc-valid-idents = ["UUIDv7", "PreVote", "CheckQuorum", "OpenSSH", ".."]
