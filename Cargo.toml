[workspace]
resolver = "3"
members = ["crates/*", "xtask", "bench/*"]
exclude = ["docs", "patches"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["aws-lc-sys"] }
blake3 = "1.8.7"
bytes = { version = "1.12.1", default-features = false, features = ["std"] }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
core_affinity = "0.8.3"
crc32c = "0.6.8"
divan = "0.1.21"
getrandom = "0.4.3"
hdrhistogram = { version = "7.6.0", default-features = false }
http = "1.5.0"
http-body = "1.1.0"
hyper = { version = "1.12.0", features = ["client", "http1"] }
influxdb-line-protocol = "2.0.0"
libc = "0.2.190"
libloading = "0.9.0"
loom = { version = "0.7.2", features = ["futures"] }
noq-proto = { version = "=1.3.0", default-features = false, features = ["rustls", "aws-lc-rs"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
noq = { version = "1.3.0", default-features = false }
rustc-hash = { version = "2.1.3", default-features = false }
rustix = { version = "1.1.5", features = ["mm", "param"] }
rustls = { version = "0.23.45", default-features = false, features = ["std", "aws_lc_rs"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false }
unicode-ident = "1.0.26"
unicode-properties = { version = "0.1.4", default-features = false, features = [
    "general-category",
] }
zeroize = { version = "1.9.0", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
non_ascii_idents = "deny"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
let_underscore_drop = "warn"
redundant_lifetimes = "warn"
unused_lifetimes = "warn"
elided_lifetimes_in_paths = "warn"
meta_variable_misuse = "warn"
unused_macro_rules = "warn"
ffi_unwind_calls = "warn"
ambiguous_negative_literals = "warn"
redundant_imports = "warn"
unnameable_types = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
  "cfg(loom)",
  "cfg(shuttle)",
  "cfg(fuzzing)",
] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"

allow_attributes = "deny"
allow_attributes_without_reason = "deny"

multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
non_send_fields_in_send_ty = "warn"
transmute_undefined_repr = "warn"
as_ptr_cast_mut = "warn"
as_pointer_underscore = "deny"
fn_to_numeric_cast_any = "deny"

missing_assert_message = "warn"
assertions_on_result_states = "deny"
unused_result_ok = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
unwrap_in_result = "warn"
get_unwrap = "deny"
fallible_impl_from = "warn"
unimplemented = "deny"
exit = "deny"

iter_over_hash_type = "deny"
pointer_format = "deny"
cfg_not_test = "deny"
host_endian_bytes = "deny"

clone_on_ref_ptr = "warn"
mutex_integer = "deny"
mutex_atomic = "deny"
rc_buffer = "warn"
missing_asserts_for_indexing = "warn"
infinite_loop = "deny"
large_stack_frames = "warn"

module_name_repetitions = "warn"
partial_pub_fields = "deny"
tests_outside_test_module = "deny"
redundant_test_prefix = "warn"
doc_paragraphs_missing_punctuation = "warn"
wildcard_dependencies = "deny"

[profile.dev]
debug = "line-tables-only"

# Dependencies build optimized so tests run fast. Workspace crates stay at opt-level 0
# with debug assertions and overflow checks.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
overflow-checks = true
panic = "abort"
codegen-units = 1
lto = "fat"
debug = "line-tables-only"

# Local patches: docs/dependencies.md.
[patch.crates-io]
noq-proto = { path = "patches/noq-proto" }
