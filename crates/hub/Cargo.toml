[package]
name = "hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Exposes `testing` to the tests of `hub` and the crates above it.
sim = ["home/sim"]

[dependencies]
access = { path = "../access" }
block = { path = "../block" }
clock = { path = "../clock" }
env = { path = "../env" }
home = { path = "../home" }
mesh = { path = "../mesh" }
spec = { path = "../spec" }
transport = { path = "../transport" }
types = { path = "../types" }
wire = { path = "../wire" }

[dev-dependencies]
aws-lc-rs.workspace = true
blob = { path = "../blob" }
block = { path = "../block", features = ["sim"] }
buffer = { path = "../buffer" }
codec = { path = "../codec" }
counting = { path = "../counting" }
# Turns on `sim`, because the bench host runs no features.
hub = { path = ".", features = ["sim"] }
sim = { path = "../sim" }

[[test]]
name = "alloc"
harness = false

[[bench]]
name = "reader"
harness = false
test = true

[[bench]]
name = "woken"
harness = false
test = true

[lints]
workspace = true
