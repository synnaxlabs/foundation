[package]
name = "buffer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Exposes `wal::Writer` and `log::Logs` to the benches. Off by default.
sim = []

[dependencies]
block = { path = "../block" }
crc32c = { workspace = true }
env = { path = "../env" }
types = { path = "../types" }

[dev-dependencies]
# Turns on `sim` for the bench, since the bench host runs no features.
buffer = { path = ".", features = ["sim"] }
counting = { path = "../counting" }
divan = { workspace = true }
proptest = { workspace = true }
sim = { path = "../sim" }
waker = { path = "../waker" }

[[test]]
name = "alloc"
harness = false

[[bench]]
name = "wal"
harness = false
test = true

[[bench]]
name = "logs"
harness = false
test = true

[lints]
workspace = true
