[package]
name = "os"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# `os::net()`. A `--cfg loom` build leaves it off, as Tokio has no `net` there.
net = ["dep:noq-udp"]

[dependencies]
block = { path = "../block" }
env = { path = "../env" }
getrandom = { workspace = true }
rustix = { workspace = true, features = ["fs", "net"] }
tokio = { workspace = true, features = ["net", "rt", "sync", "time"] }
types = { path = "../types" }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = { workspace = true }
# The UDP socket calls of `env::net` (#119).
noq-udp = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# The parsers of `/proc/meminfo` and `/proc/self/cgroup` and `mountinfo`.
procfs-core = { workspace = true }
rustix = { workspace = true, features = ["thread"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The Mach calls that give the free pages of the host.
mach2 = { workspace = true }

[dev-dependencies]
counting = { path = "../counting" }
divan = { workspace = true }
# Turns `net` on for the tests and benches of this crate.
os = { path = ".", features = ["net"] }
proptest = { workspace = true }
rustix = { workspace = true, features = ["process"] }
tokio = { workspace = true, features = ["net", "rt", "time"] }

[[test]]
name = "alloc"
harness = false

[[test]]
name = "interrupt"
harness = false

# Needs `sudo`: only one CI step on a GitHub-hosted runner runs it.
[[test]]
name = "root"
path = "tests/root/main.rs"
test = false

[[bench]]
name = "net"
harness = false

[[bench]]
name = "now"
harness = false

[[bench]]
name = "udp"
harness = false

[lints]
workspace = true
