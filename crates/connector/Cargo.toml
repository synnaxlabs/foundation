[package]
name = "connector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
sim = ["hyper/server", "hub/sim"]

[dependencies]
bytes.workspace = true
http.workspace = true
http-body.workspace = true
hyper.workspace = true
rustls = { workspace = true, features = ["tls12"] }
rustls-webpki.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true
block = { path = "../block" }
codec = { path = "../codec" }
env = { path = "../env" }
hub = { path = "../hub" }
secret = { path = "../secret" }
document = { path = "../document" }
spec = { path = "../spec" }
types = { path = "../types" }

[target.'cfg(loom)'.dependencies]
loom = { workspace = true }

[dev-dependencies]
# Turns on `sim`, because the bench host runs no features.
connector = { path = ".", features = ["sim"] }
counting = { path = "../counting" }
hub = { path = "../hub", features = ["sim"] }
proptest = { workspace = true }
sim = { path = "../sim" }
wire = { path = "../wire" }

[[test]]
name = "alloc"
harness = false

[[test]]
name = "memory"
harness = false

[[test]]
name = "browse"
harness = false

[[bench]]
name = "browse"
harness = false
test = true

[[bench]]
name = "origin"
harness = false
test = true

[[bench]]
name = "run"
harness = false
test = true

[[bench]]
name = "stamp"
harness = false
test = true

[lints]
workspace = true
