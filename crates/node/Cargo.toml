[package]
name = "node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Exposes `Scope` to the `scope` bench, `fuzz` to the fuzz targets, and `create_key` and
# `Region::Given` to the tests. Off by default.
sim = []

[[bin]]
name = "foundation"
path = "src/main.rs"

[dependencies]
access = { path = "../access" }
blob = { path = "../blob" }
block = { path = "../block" }
buffer = { path = "../buffer" }
program = { path = "../program" }
clock = { path = "../clock" }
config-hcl = { path = "../config-hcl" }
connector = { path = "../connector" }
connector-influx = { path = "../connector-influx" }
connector-modbus = { path = "../connector-modbus" }
connector-opcua = { path = "../connector-opcua", features = ["open62541"] }
crc32c = { workspace = true }
document = { path = "../document" }
env = { path = "../env" }
estimate = { path = "../estimate" }
home = { path = "../home" }
hub = { path = "../hub" }
mesh = { path = "../mesh" }
ops = { path = "../ops" }
os = { path = "../os" }
secret = { path = "../secret" }
serde = { workspace = true }
serde_json = { workspace = true }
spec = { path = "../spec" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
transport = { path = "../transport" }
types = { path = "../types" }
wire = { path = "../wire" }

[dev-dependencies]
block = { path = "../block", features = ["sim"] }
bytes = { workspace = true }
codec = { path = "../codec" }
connector = { path = "../connector", features = ["sim"] }
connector-influx = { path = "../connector-influx", features = ["sim"] }
connector-opcua = { path = "../connector-opcua", features = ["sim"] }
counting = { path = "../counting" }
divan = { workspace = true }
http = { workspace = true }
hub = { path = "../hub", features = ["sim"] }
# Turns on `sim` for the bench, since the bench host runs no features.
node = { path = ".", features = ["sim"] }
proptest = { workspace = true }
sim = { path = "../sim" }

# Under `--cfg loom`, Tokio has no `net`.
[target.'cfg(not(loom))'.dev-dependencies]
sdk = { path = "../../sdk/rust" }

[[test]]
name = "erase"
harness = false

[[test]]
name = "memory"
harness = false

[[bench]]
name = "scope"
harness = false
test = true

[[bench]]
name = "log"
harness = false
test = true

[target.'cfg(loom)'.dependencies]
loom = { workspace = true }

# Under `--cfg loom`, tokio has no `net`.
[target.'cfg(not(loom))'.dependencies]
# `foundation start` serves over `os::net()`.
os = { path = "../os", features = ["net"] }

[lints]
workspace = true
