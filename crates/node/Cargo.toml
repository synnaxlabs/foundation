[package]
name = "node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Exposes `Scope` to the `scope` bench. Off by default.
sim = []

[[bin]]
name = "foundation"
path = "src/main.rs"

[dependencies]
block = { path = "../block" }
buffer = { path = "../buffer" }
clock = { path = "../clock" }
env = { path = "../env" }
estimate = { path = "../estimate" }
home = { path = "../home" }
hub = { path = "../hub" }
mesh = { path = "../mesh" }
ops = { path = "../ops" }
os = { path = "../os" }
transport = { path = "../transport" }
types = { path = "../types" }
wire = { path = "../wire" }

[dev-dependencies]
codec = { path = "../codec" }
counting = { path = "../counting" }
divan = { workspace = true }
# Turns on `sim` for the bench, since the bench host runs no features.
node = { path = ".", features = ["sim"] }
proptest = { workspace = true }
sim = { path = "../sim" }

[[bench]]
name = "scope"
harness = false
test = true

[target.'cfg(loom)'.dependencies]
loom = { workspace = true }

[lints]
workspace = true
