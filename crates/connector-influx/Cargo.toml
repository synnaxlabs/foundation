[package]
name = "connector-influx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
sim = [
    "connector/sim",
    "dep:env",
    "dep:influxdb-line-protocol",
]

[dependencies]
base64ct.workspace = true
bytes.workspace = true
codec = { path = "../codec" }
connector = { path = "../connector" }
document = { path = "../document" }
form_urlencoded.workspace = true
env = { path = "../env", optional = true }
http.workspace = true
hub = { path = "../hub" }
influxdb-line-protocol = { workspace = true, optional = true }
types = { path = "../types" }
unicode-properties.workspace = true

[dev-dependencies]
connector = { path = "../connector", features = ["sim"] }
# Turns on `sim` for the tests and the bench, since the bench host runs no features.
connector-influx = { path = ".", features = ["sim"] }
counting = { path = "../counting" }
divan.workspace = true
env = { path = "../env" }
hub = { path = "../hub", features = ["sim"] }
proptest.workspace = true
sim = { path = "../sim" }
spec = { path = "../spec" }

[[bench]]
name = "batch"
harness = false
test = true

[[bench]]
name = "line"
harness = false
test = true

[[bench]]
name = "request"
harness = false
test = true

[[bench]]
name = "sim"
harness = false
test = true

[[test]]
name = "memory"
harness = false

[[test]]
name = "conformance"
path = "../../oracles/conformance/connector/influx/main.rs"

[lints]
workspace = true
