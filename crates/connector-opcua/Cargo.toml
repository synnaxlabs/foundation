[package]
name = "connector-opcua"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
open62541 = ["dep:aws-lc-sys", "dep:cc"]
# Exposes `bench` to the `run`, `manager`, `client`, `kind`, and `value` benches,
# `fuzz` to the fuzz target, both to the `alloc` and `memory` tests, and `sim` to the
# tests of other crates.
sim = ["open62541"]

[dependencies]
# The libcrypto of the OpenSSL plugins of open62541. Its `links` gives `build.rs` its
# headers.
aws-lc-sys = { workspace = true, optional = true }
block = { path = "../block" }
connector = { path = "../connector" }
document = { path = "../document" }
env = { path = "../env" }
hub = { path = "../hub" }
types = { path = "../types" }

[build-dependencies]
cc = { workspace = true, optional = true }

[dev-dependencies]
cc = { workspace = true }
codec = { path = "../codec" }
connector = { path = "../connector", features = ["sim"] }
# Turns on `sim`, since the bench host runs no features.
connector-opcua = { path = ".", features = ["sim"] }
counting = { path = "../counting" }
divan = { workspace = true }
hub = { path = "../hub", features = ["sim"] }
proptest = { workspace = true }
sim = { path = "../sim" }
spec = { path = "../spec" }

[[test]]
name = "alloc"
harness = false

[[test]]
name = "memory"
harness = false
required-features = ["open62541"]

[[bench]]
name = "decode"
harness = false
test = true
required-features = ["open62541"]

[[bench]]
name = "run"
harness = false
test = true

[[bench]]
name = "manager"
harness = false
test = true

[[bench]]
name = "client"
harness = false
test = true

[[bench]]
name = "kind"
harness = false
test = true

[[bench]]
name = "value"
harness = false
test = true

[lints]
workspace = true
