[package]
name = "connector-opcua"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
open62541 = ["dep:cc"]

[dependencies]
env = { path = "../env" }
types = { path = "../types" }

[build-dependencies]
cc = { workspace = true, optional = true }

[dev-dependencies]
cc = { workspace = true }
# Turns on `open62541`, since the bench host runs no features.
connector-opcua = { path = ".", features = ["open62541"] }
counting = { path = "../counting" }
divan = { workspace = true }
sim = { path = "../sim" }

[[test]]
name = "alloc"
harness = false

[[bench]]
name = "run"
harness = false
test = true

[lints]
workspace = true
