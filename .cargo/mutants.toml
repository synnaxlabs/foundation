# Build with all features on, as CI's test step does, so code behind a feature such as
# `sim` is mutated and tested.
all_features = true

# The profile of `Cargo.toml` with no debug info.
profile = "mutants"

# Mutants that no caller or peer can see, that only a job outside the mutants run
# kills, or that no test kills yet (with its open issue). Each has its reason.
exclude_re = [
  # A type name shows only in a panic of `connector_opcua::fuzz::decode`, which a
  # correct open62541 never gives. `fuzz::tests` checks the names.
  'crates/connector-opcua/src/ffi\.rs:.*replace DataType::name -> &.static str with',
  # The entry of the `connector_opcua_certificate` target. With no body, the target
  # gives fewer features at `INITED` than its floor in `FLOORS` of `xtask/src/fuzz.rs`,
  # and the fuzz job fails.
  'crates/connector-opcua/src/fuzz\.rs:.*replace certificate with \(\)$',
  # A larger size only allocates more for a decoded value, and no count sees it.
  # `fuzz::tests` checks the sizes.
  'crates/connector-opcua/src/ffi\.rs:.*replace & with (\||\^) in DataType::size',
  # The bits of the type id and of the array flag of a mask are disjoint, so `^` gives
  # the mask that `|` gives.
  'crates/connector-opcua/src/server\.rs:.*replace \| with \^ in doubles$',
  # The body of `Unformatted::format_fields` is `Ok(())`, which the mutant gives.
  'crates/node/src/log\.rs:.*replace <impl FormatFields<.w> for Unformatted>::format_fields',
  # The default body of `Kind::tag` is `None`, which the mutant gives.
  'crates/connector/src/kind\.rs:.*replace Kind::tag -> Option<String> with None$',
  # Benchmarks ship in no binary; the run itself checks them.
  '^bench/',
  # `main` reads the arguments and calls a task. Each task has its own tests.
  'xtask/src/main\.rs:.*(replace main ->| in main$)',
  # The run needs the pinned nightly, which the mutants job does not install. A planted
  # overflow in the shim fails the sanitizers job.
  'xtask/src/sanitizers\.rs:.*(replace run ->| in run$)',
  # The build and the runs need the pinned nightly and cargo-fuzz, which no test has. A
  # crash planted in a target must fail the `fuzz` job of `ci.yaml` (#2105).
  'xtask/src/fuzz\.rs:.*(replace run_one ->| in run$)',
  # Calls the GitHub API. The review workflow runs it on each PR: with no PR record,
  # the status is `error`.
  'xtask/src/gh\.rs:.*(replace api ->| in api$)',
  # A node would intern 2^32 - 1 key sets before the bound shows, which no test or
  # node can hold. `panics_on_the_interned_set_of_the_ordered_key` kills it.
  'crates/types/src/frame/key_set\.rs:.*replace < with <= in interned$',
  # Empty outside loom. The loom models fail when a marker is removed.
  'crates/block/src/sync\.rs:.*Track::(read|write)',
  # The stub is built only under loom, so no test of another build sees its mutant.
  # The real `net` has no mutant that builds.
  'crates/node/src/main\.rs:.*replace net -> env::net::Net with Default::default\(\)$',
  # Empty outside a build with the address sanitizer, which `cargo xtask sanitizers`
  # and the fuzz builds make. In `cargo xtask sanitizers`,
  # `asan_reports_a_write_before_a_block` fails without it.
  'crates/connector-opcua/src/alloc\.rs:.*replace poison with \(\)$',
  # Empty outside a build with the address sanitizer. In `cargo xtask sanitizers`,
  # `block` reads the header, and the alloc tests fail without it.
  'crates/connector-opcua/src/alloc\.rs:.*replace unpoison with \(\)$',
  # `moves` is a `sim` hook, so no caller or peer sees it. Only the private reads of
  # `sends_from_one_run_on_one_connection_ask_for_one_move` and
  # `a_send_from_a_run_with_no_value_moves_on_only_its_connection` kill the mutant.
  'crates/connector-opcua/src/connection\.rs:.*replace \+ with \* in State::move_on$',
  # The fields of a UUIDv7 share no bit, so `^` gives the same bits as `|`.
  'crates/types/src/uuid\.rs:.*replace \| with \^ in v7$',
  # Class 4 is 320 bytes on either side of the branch: `ALIGN * 5` and
  # `(ALIGN << 0) * 5`.
  'crates/block/src/lib\.rs:.*replace < with <= in class_payload',
  # At `index == CLASSES_MAX` both arms give `CLASSES_MAX`. `Ord::min` is not `const`.
  'crates/block/src/lib\.rs:.*replace < with <= in classes$',
  # Stubs that panic until #68 fills them; #68 removes these lines.
  'crates/transport/src/datagram\.rs:',
  'crates/transport/src/session\.rs:.*Session::datagrams\b',
  # Parts in the block reach the sum of the slow path of `size` only when (bytes +
  # 255) times the count of parts overflows `usize`, such as 2^33 parts of a block of
  # 2 GiB, the largest block, which no test can allocate. Parts outside the block
  # panic first.
  'crates/transport/src/stream\.rs:.*replace - with \+ in size$',
  # `Vec::leak(Vec::new())` is the same empty slice as `&[]`.
  'crates/transport/src/tls\.rs:.*root_hint_subjects.*Vec::leak',
  # The boundary draw is a 64-bit hash against a multiple of 2^64. Equality needs a
  # draw that is an exact multiple of 2^16, so no input tells `<` from `<=`.
  'crates/spec/src/tree/chunker\.rs:.*replace < with <= in boundary',
  # A false `valid` sends each series to the check of each sample, which gives the same
  # result more slowly.
  'crates/codec/src/text\.rs:.*replace valid -> bool with false',
  # Ticks are unique, so no sector is written at the tick that a write started.
  'crates/sim/src/disk\.rs:.*replace > with >= in File::write',
  # The coin is fair: either side gives the same set of outcomes.
  'crates/sim/src/disk\.rs:.*replace == with != in File::write',
  # The text of an open directory, listing, or file of a host shows only in a failed
  # assertion.
  'crates/sim/src/drivers/paths\.rs:.*replace <impl fmt::Debug for (Dir|File|Listing)>::fmt',
  # The bits never overlap: no function code has bit 7 set, and a shifted byte has
  # bit 0 clear. So `|` and `^` give the same result.
  'crates/connector-modbus/src/pdu\.rs:.*replace \| with \^ in (Request::decode_reply|pack)',
  # `rows` fills bits 0 to 15 and `columns << 16` bits 16 to 31, so `|` and `^` give
  # the same `n`.
  'crates/home/src/stored\.rs:.*replace \| with \^ in codes',
  # `at` fills bits 0 to 15 and `array << 16` bit 16, so `|` and `^` give the same
  # fault.
  'crates/connector-opcua/src/value\.rs:.*replace \| with \^ in Fault::of_type',
  # The oracle of `node.key` in the `node_identity` fuzz target and the property
  # tests. It panics only when `sector::written` disagrees with `encode` of `fields`,
  # and the mutants of `written` show that it does.
  'crates/node/src/identity\.rs:.*replace check with \(\)',
  # The oracle of `admin.key` in the same target and tests, for the same reason.
  'crates/sector/src/admin\.rs:.*replace check with \(\)',
  # The check that `identity::check`, `admin::check`, and `address::check` call, for
  # the same reason. The unit tests `panics_when_a_decode_*` of `sector` show that it
  # panics.
  'crates/sector/src/lib\.rs:.*replace check with \(\)',
  # The oracle of `address` in the same target and tests, for the same reason.
  'crates/sector/src/address\.rs:.*replace check with \(\)',
  # The entry of the target, which panics only when a `check` does.
  'crates/node/src/fuzz\.rs:.*replace identity with \(\)',
  # No caller sees the bytes that `file` gives: `identity` panics only when a `check`
  # does. The unit test `a_file_is_its_bytes_or_its_body_with_the_checksum` reads them.
  'crates/node/src/fuzz\.rs:.*replace file -> ',
  # Only Miri sees the stub task that a skipped clear leaks, and the miri shard jobs run
  # those tests.
  'crates/connector-ni/src/daqmx\.rs:.*replace <impl Drop for Task>::drop with \(\)',
  # A fence changes the order of memory operations around a counter read, and no
  # result a test can see. Loom does not model a counter read.
  'crates/os/src/clock\.rs:.*replace (settle|hold) with \(\)',
  # When the measured time asleep equals the largest, `fetch_max` stores the same
  # value, so `>=` gives the same result as `>`.
  'crates/os/src/clock\.rs:.*replace > with >= in combine',
  # A `Tcp` has no write buffer, so a flush is ready at once. `Poll::Ready(Ok(()))` is
  # what the body returns.
  'crates/connector/src/http/stream\.rs:.*<impl AsyncWrite for Adapter>::poll_flush',
  # rustls writes TLS records only with `write_vectored` (rustls 0.23.46, `vecbuf.rs`),
  # which `tokio-rustls` maps to `poll_write_vectored`, so no path calls `poll_write`.
  'crates/connector/src/http/stream\.rs:.*<impl AsyncWrite for Adapter>::poll_write ->',
  # An out connector has no device channel. `Ok(Channels::default())` is what the body
  # returns.
  'crates/connector-influx/src/lib\.rs:.*replace <impl kind::Kind for Kind>::check ->',
  # `root::free_drops_by_the_bytes_of_a_created_file` kills both, in the `Root tests`
  # step of the `check` job, which the mutants run does not see.
  'crates/os/src/files\.rs:.*in <impl env::files::Driver for Disk>::free$',
  # macOS only. The mutants run is on Linux and does not build it; its tests run in
  # the `macos` check.
  'crates/os/src/allocate\.rs:',
  # macOS only, as above. On macOS the mutant does not build: no arm then gives the
  # `Ok` type.
  'crates/os/src/memory\.rs:.*delete match arm 0 in .*Memory>::discard$',
  # macOS only, as above. `this_host_has_whole_pages_available` and
  # `the_free_inactive_and_purgeable_pages_are_available` catch its mutants.
  'crates/os/src/memory/available\.rs:.*macos::',
  # macOS only, as above. `a_write_takes_at_most_the_unsent_bound` catches its
  # mutants.
  'crates/os/src/net/unsent\.rs:.*Bound::new',
  # macOS only, as above. These tests in `crates/os/tests/it/net.rs` catch its
  # mutants: `a_write_takes_at_most_the_unsent_bound`,
  # `a_write_after_a_small_write_takes_the_rest_of_the_unsent_bound`,
  # `a_vectored_write_across_the_unsent_bound_takes_the_whole_parts`,
  # `whole_parts_that_fill_the_unsent_bound_go_in_one_write`,
  # `small_writes_below_the_unsent_bound_wait_for_no_event`,
  # `a_write_waits_at_the_unsent_bound_not_the_send_buffer`, and
  # `a_full_send_buffer_below_the_bound_makes_a_write_wait`.
  'crates/os/src/net/unsent\.rs:.*Bound::send',
  # macOS 15 only: Linux refuses the path at the stat. In the `macos` check,
  # `paths::within_agrees_with_free_on_a_file_with_a_slash_or_a_dot` catches it.
  'crates/os/src/paths\.rs:.*guard names_directory\(path\) with false in read$',
  # The mutants run on Linux, where no two flag sets that `^` joins share a bit, so
  # `|` and `^` give the same flags. On macOS `SEARCH` and `DIR` in `Dir::open` share
  # `O_DIRECTORY`.
  'crates/os/src/paths\.rs:.*replace \| with \^ in Dir::open$',
  'crates/os/src/paths\.rs:.*replace \| with \^ in Dir::read$',
  'crates/os/src/paths\.rs:.*replace \| with \^ in Dir::write$',
  'crates/os/src/paths\.rs:.*replace \| with \^ in Dir::replace$',
  # macOS only, as above. In the `macos` check,
  # `paths::tests::a_directory_held_by_its_key_alone_gives_no_path` catches it.
  'crates/os/src/paths\.rs:.*replace != with == in Dir::open$',
  # macOS only, as above. In the `macos` check,
  # `paths::tests::a_directory_gives_the_path_at_which_the_host_finds_it_now` and
  # `paths::a_dot_dot_to_a_directory_that_the_walk_did_not_pass_goes_where_the_host_gives`
  # catch its mutants.
  'crates/os/src/paths\.rs:.*replace getpath -> ',
  # No input makes `getaddrinfo` give `EAI_AGAIN` or `EAI_MEMORY` on demand. The test of
  # the map, through a private call, kills each.
  'crates/os/src/net/resolve\.rs:.*delete match arm \(libc::EAI_(AGAIN|MEMORY), _\)',
  # The list is C memory, so no test sees a leak (#1928).
  'crates/os/src/net/resolve\.rs:.*replace <impl Drop for List>::drop with \(\)',
  # The flags of a socket share no bit, so `|` and `^` give the same flags.
  'crates/os/src/net\.rs:.*replace \| with \^ in socket$',
  # Only a pool whose largest block is 1472 bytes tells `<` from `<=`. Block sizes are
  # 64 times 2^k times 5 to 8, so none is 1472: 1280, then 1536.
  'crates/transport/src/client\.rs:.*replace < with <= in Config::setup',
  # A kept `Weak` of a reader that went changes only the memory of the hub, and no
  # counting-allocator test opens remote readers yet (#2015). The unit test of
  # `Sessions::add` kills it through the length of the list.
  'crates/hub/src/reader/remote\.rs:.*replace > with >= in Sessions::add',
  # Equal keys get no rule (ONE SESSION PER PEER, rule 4), so no test can pin `<`.
  'crates/transport/src/table\.rs:.*replace < with <= in Table::arrive',
  # Only the `wal` bench calls `buffer::bench::Group::commit`, and it gives nothing
  # back. Its test kills the mutant through the private writer.
  'crates/buffer/src/bench\.rs:.*replace Group::commit with \(\)$',
  # Only the `wal` bench calls `buffer::bench::Group::queue`, and it gives nothing
  # back. Its test kills the mutant through the private writer and logs.
  'crates/buffer/src/bench\.rs:.*replace Group::queue with \(\)$',
  # Only the `logs` bench calls `buffer::bench::Logs::commit`, and it gives nothing
  # back. Its test kills the mutants through the private logs.
  'crates/buffer/src/bench\.rs:.*replace Logs::commit with \(\)$',
  'crates/buffer/src/bench\.rs:.* in Logs::commit$',
  # Only the `logs` bench calls `buffer::bench::Logs::append`, and it gives nothing
  # back. Its test kills the mutants through the private logs.
  'crates/buffer/src/bench\.rs:.*replace Logs::append with \(\)$',
  'crates/buffer/src/bench\.rs:.* in Logs::append$',
  # Only the `logs` bench calls `buffer::bench::Logs::carry`, and it gives nothing
  # back. Its test kills the mutants through the private logs.
  'crates/buffer/src/bench\.rs:.*replace Logs::carry with \(\)$',
  'crates/buffer/src/bench\.rs:.* in Logs::carry$',
  # Only the `logs` bench calls `buffer::bench::Logs::trim`, and it gives nothing
  # back. Its test kills the mutants through the private logs and tails.
  'crates/buffer/src/bench\.rs:.*replace Logs::trim with \(\)$',
  # Only `Logs::trim` and `Logs::fill` call `buffer::bench::Logs::slow`, and it gives
  # nothing back. Their tests kill the mutants of its body through the private logs
  # and tails.
  'crates/buffer/src/bench\.rs:.* in Logs::slow$',
  # Only the `logs` bench calls `buffer::bench::Logs::fill`, and it gives nothing
  # back. Its test kills the mutant through the private tails.
  'crates/buffer/src/bench\.rs:.*replace Logs::fill with \(\)$',
  # Only the `logs` bench and the `alloc` test call `buffer::bench::Logs::mark`,
  # and it gives nothing back. The `alloc` test kills the mutants of its body.
  'crates/buffer/src/bench\.rs:.*replace Logs::mark with \(\)$',
  # Only the `wal` bench calls `buffer::bench::Deadline::trimming`, and it reads
  # nothing back. `the_deadline_after_trimming_trims_a_step` kills the mutants
  # through the private writer.
  'crates/buffer/src/buffer/bench\.rs:.* in Deadline::trimming$',
  # A connector on another node runs here only in a mesh of two nodes, which no test of
  # `Node` starts yet (#2272, whose test removes this entry). The test of `Runs`
  # `a_connector_on_another_node_starts_no_run` kills it.
  'crates/node/src/connectors\.rs:.*\*connector\.node\(\) == self\.node with true',
  # A kept clone of an ended session holds only memory of shard 0 (its carrier slot)
  # while its place lives, and a close of an ended session does nothing. No counting
  # test of `node` opens sessions yet (#2370). The unit test
  # `a_session_whose_hold_drops_leaves_its_place` kills it through `Places::take`.
  'crates/node/src/route\.rs:.*replace <impl Drop for Hold>::drop with \(\)',
  # Without the join, a thread `log` that has ended its run still ends by itself, only
  # later. Only a race with the end of that thread sees it.
  'crates/node/src/log/queue\.rs:.*replace join with \(\)$',
  # Only the benches drop a `bench::Log`. With `()`, the hold still drops, so the
  # thread `log` writes each line and ends by itself, only later. Only a race with
  # that thread sees it.
  'crates/node/src/bench\.rs:.*replace <impl Drop for Log>::drop with \(\)$',
  # The loop of the constant assertion of the status names: a mutant that skips it
  # still builds, and no test sees a check that runs at compile time.
  'crates/node/src/status\.rs:.*replace < with (==|>)$',
  # At the bound, both arms give the bound.
  'crates/codec/src/alp\.rs:.*replace (< with <=|> with >=) in Stats::of_f64$',
  # A stub that panics until PR B2 of #432 fills it; B2 removes this line.
  'crates/connector-modbus/src/kind\.rs:.*replace <impl kind::Kind for Kind>::run ->',
  # `Holder::copy` asserts that `at` fits in 31 bits, so bit 31 is clear and `^`
  # gives the same bits as `|`.
  'crates/buffer/src/log\.rs:.*replace \| with \^ in Holder::copy$',
  # A read's assembly (`SKIP` false) never reaches `Skipped`: its `skip` fails to
  # build. So the arm under a true guard is never taken.
  'crates/wire/src/hub/part\.rs:.*replace match guard SKIP with true in Assembly<SKIP>::(body|take)$',
  # The lead of a frame is 11 bytes and 8 for each place, so it is odd, and each block
  # payload is even: the lead never equals the largest block.
  'crates/program/src/write\.rs:.*replace > with >= in Writer::open$',
  # `Replies::decode` gives a `Stored` error only with `bound` below or above
  # `frames`, never equal to it.
  'crates/wire/src/hub\.rs:.*replace < with <= in <impl fmt::Display for Error>::fmt$',
  # The task side of a writer of `sdk` needs a node, and the mutants of `sdk` run only
  # its own tests. With either mutant, no writer opens, and each writer test of
  # `crates/node/tests/it/sdk.rs` fails in the wait of `planted`.
  'sdk/rust/src/lib\.rs:.*replace served with \(\)$',
  'sdk/rust/src/write\.rs:.*replace (serve|served) with \(\)$',
]
