# Build with all features on, as CI's test step does, so code behind a feature such as
# `sim` is mutated and tested.
all_features = true

# Mutants that no test can catch, each with the reason.
exclude_re = [
  # A type name shows only in a panic of `connector_opcua::fuzz::decode`, which a
  # correct open62541 never gives. `fuzz::tests` checks the names.
  'crates/connector-opcua/src/ffi\.rs:.*replace DataType::name -> &.static str with',
  # A larger size only allocates more for a decoded value, and no count sees it.
  # `fuzz::tests` checks the sizes.
  'crates/connector-opcua/src/ffi\.rs:.*replace & with (\||\^) in DataType::size',
  # Benchmarks ship in no binary; the run itself checks them.
  '^bench/',
  # `main` reads the arguments and calls a task. Each task has its own tests.
  'xtask/src/main\.rs:.*(replace main ->| in main$)',
  # Miri needs the pinned nightly, which only the miri CI job installs. A deliberate
  # break in that job shows that it fails.
  'xtask/src/miri\.rs:.*(replace run ->| in run$)',
  # Calls the GitHub API. The review workflow runs it on each PR: a round with findings
  # shows that it fails.
  'xtask/src/review\.rs:.*(replace run ->| in run$)',
  # Calls the GitHub API. The review workflow runs it on each PR: with no PR record,
  # the status is `error`.
  'xtask/src/review\.rs:.*(replace gh ->| in gh$)',
  # Empty outside loom. The loom models fail when a marker is removed.
  'crates/block/src/sync\.rs:.*Track::(read|write)',
  # Class 4 is 320 bytes on either side of the branch: `ALIGN * 5` and
  # `(ALIGN << 0) * 5`.
  'crates/block/src/lib\.rs:.*replace < with <= in class_payload',
  # Stubs that panic until #68 fills them; #68 removes these lines.
  'crates/transport/src/datagram\.rs:',
  'crates/transport/src/session\.rs:.*Session::datagrams\b',
  # Parts in the block reach the sum of the slow path of `size` only when (bytes +
  # 255) times the count of parts overflows `usize`, such as 2^33 parts of a block of
  # 2 GiB, the largest block, which no test can allocate. Parts outside the block
  # panic first.
  'crates/transport/src/stream\.rs:.*replace - with \+ in size$',
  # `Vec::leak(Vec::new())` is the same empty slice as `&[]`.
  'crates/transport/src/tls\.rs:.*root_hint_subjects.*Vec::leak',
  # The boundary draw is a 64-bit hash against a multiple of 2^64. Equality needs a
  # draw that is an exact multiple of 2^16, so no input tells `<` from `<=`.
  'crates/spec/src/tree/chunker\.rs:.*replace < with <= in boundary',
  # A false `valid` sends each series to the check of each sample, which gives the same
  # result more slowly.
  'crates/codec/src/text\.rs:.*replace valid -> bool with false',
  # Ticks are unique, so no sector is written at the tick that a write started.
  'crates/sim/src/disk\.rs:.*replace > with >= in File::write',
  # The coin is fair: either side gives the same set of outcomes.
  'crates/sim/src/disk\.rs:.*replace == with != in File::write',
  # The bits never overlap: no function code has bit 7 set, and a shifted byte has
  # bit 0 clear. So `|` and `^` give the same result.
  'crates/connector-modbus/src/pdu\.rs:.*replace \| with \^ in (Request::decode_reply|pack)',
  # `rows` fills bits 0 to 15 and `columns << 16` bits 16 to 31, so `|` and `^` give
  # the same `n`.
  'crates/home/src/stored\.rs:.*replace \| with \^ in codes',
  # Only Miri sees the stub task that a skipped clear leaks, and the miri job runs
  # those tests.
  'crates/connector-ni/src/daqmx\.rs:.*replace <impl Drop for Task>::drop with \(\)',
  # A fence changes the order of memory operations around a counter read, and no
  # result a test can see. Loom does not model a counter read.
  'crates/os/src/clock\.rs:.*replace (settle|hold) with \(\)',
  # When the measured time asleep equals the largest, `fetch_max` stores the same
  # value, so `>=` gives the same result as `>`.
  'crates/os/src/clock\.rs:.*replace > with >= in combine',
  # A `Tcp` has no write buffer, so a flush is ready at once. `Poll::Ready(Ok(()))` is
  # what the body returns.
  'crates/connector/src/http/stream\.rs:.*<impl Write for Stream>::poll_flush',
  # An out connector has no device channel. `Ok(Channels::default())` is what the body
  # returns.
  'crates/connector-influx/src/lib\.rs:.*replace <impl kind::Kind for Kind>::check ->',
  # macOS only. CI runs Linux and does not build it; its tests run on macOS.
  'crates/os/src/allocate\.rs:',
  # No input makes `getaddrinfo` give `EAI_AGAIN` or `EAI_MEMORY` on demand. The test of
  # the map, through a private call, kills each.
  'crates/os/src/net/resolve\.rs:.*delete match arm \(libc::EAI_(AGAIN|MEMORY), _\)',
  # The list is C memory, so no test sees a leak (#1928).
  'crates/os/src/net/resolve\.rs:.*replace <impl Drop for List>::drop with \(\)',
  # Only a pool whose largest block is 1472 bytes tells `<` from `<=`. Block sizes are
  # 64 times 2^k times 5 to 8, so none is 1472: 1280, then 1536.
  'crates/transport/src/client\.rs:.*replace < with <= in Config::setup',
  # A pair or a refusal at or below the lowest floor only takes memory: no outcome
  # reads it.
  'crates/mesh/src/applied\.rs:.*replace Applied::trim with \(\)',
]
