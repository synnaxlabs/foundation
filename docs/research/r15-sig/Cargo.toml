[package]
name = "r15-sig"
version = "0.1.0"
edition = "2024"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
aws-lc-rs = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
blake3 = { version = "1", features = ["neon"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
