name: Review

# Posts the commit status `review` on a PR head: success only when its review is done
# (`cargo xtask review`). The status, not this job, is the required check, because a
# run from a comment reports on `main`, not on the PR.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  merge_group:

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  gate:
    # Only round comments and director verdicts by the factory bot change the result.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       github.event.comment.user.login == 'synnax-foundation-factory[bot]')
    # At the job, so a skipped run never cancels a run in progress.
    concurrency:
      group: review-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The gate applied when the PR entered the queue.
      - if: github.event_name == 'merge_group'
        env:
          SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          gh api "repos/$GH_REPO/statuses/$SHA" -f state=success -f context=review \
            -f description="The review was done when the PR entered the queue."
      # Pending first, so a step that fails never leaves an earlier `success`.
      - if: github.event_name != 'merge_group'
        env:
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$HEAD" ]; then
            HEAD=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          fi
          echo "HEAD=$HEAD" >> "$GITHUB_ENV"
          gh api "repos/$GH_REPO/statuses/$HEAD" -f state=pending -f context=review \
            -f description="The review check runs." \
            -f target_url="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
      - if: github.event_name != 'merge_group'
        uses: actions/checkout@v4
        with:
          # The check that runs is the one on the default branch, never the PR's.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - if: github.event_name != 'merge_group'
        uses: Swatinem/rust-cache@v2
      - if: github.event_name != 'merge_group'
        env:
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          git fetch --quiet origin "refs/pull/$PR/head"
          code=0
          cargo xtask review "$PR" "$HEAD" || code=$?
          case $code in
            0) state=success description="The review is done at the head." ;;
            1) state=failure description="The review is not done at the head. See the log." ;;
            *) state=error description="The review check failed to run. See the log." ;;
          esac
          gh api "repos/$GH_REPO/statuses/$HEAD" -f state="$state" -f context=review \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
