name: ARM

on:
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']

# On main each run ends, and only the newest waiting commit runs next.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - uses: actions/checkout@v4
      - name: Add cargo to the path
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # Outside the workspace, so checkout keeps it. One job runs on a runner at a
      # time, so each runner owns its directory.
      - name: Keep the build
        run: |
          dir="$HOME/target/$RUNNER_NAME"
          if [ -d "$dir" ] && [ "$(du -sk "$dir" | cut -f1)" -gt $((25 * 1024 * 1024)) ]
          then
            rm -rf "$dir"
          fi
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --workspace
