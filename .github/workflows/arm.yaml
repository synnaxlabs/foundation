name: ARM

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'bench/**'
      - 'fuzz/**'
      - 'xtask/**'
      - 'sdk/**'
      - 'oracles/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain*'
      - 'clippy.toml'
      - 'rustfmt.toml'
      - 'deny.toml'
      - 'docs/quickstart.md'
      - '.github/workflows/**'

# On main each run ends, and only the newest waiting commit runs next.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A trigger path filter leaves a required check pending, and a skipped one passes. So
  # `test` skips only when this filter ran and found no change. A merge queue push skips
  # `test`, because the queue already ran it on the same commit.
  changes:
    if: github.event_name != 'push' || github.actor == 'github-merge-queue[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name == 'push' && 'false' || steps.filter.outputs.code }}
    steps:
      # In the merge queue, the filter diffs the group's base and head in a clone.
      - if: github.event_name == 'merge_group'
        uses: actions/checkout@v4
      - if: github.event_name != 'push'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          base: ${{ github.event.merge_group.base_sha }}
          ref: ${{ github.event.merge_group.head_sha }}
          filters: |
            code:
              - 'crates/**'
              - 'bench/**'
              - 'fuzz/**'
              - 'xtask/**'
              - 'sdk/**'
              - 'oracles/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'clippy.toml'
              - 'rustfmt.toml'
              - 'deny.toml'
              - 'docs/quickstart.md'
              - '.github/workflows/**'

  test:
    needs: changes
    if: "!cancelled() && needs.changes.outputs.code != 'false'"
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      # As in `check` of `ci.yaml`.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install numpy==2.4.6
          echo "PYO3_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "FOUNDATION_NODE=$PWD/target/debug/foundation" >> "$GITHUB_ENV"
      - name: Test
        run: |
          failed=0
          cargo xtask test nextest || failed=1
          cargo xtask test serial || failed=1
          exit "$failed"
