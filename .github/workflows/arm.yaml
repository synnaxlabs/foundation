name: ARM

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'bench/**'
      - 'fuzz/**'
      - 'xtask/**'
      - 'oracles/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain*'
      - 'clippy.toml'
      - 'rustfmt.toml'
      - 'deny.toml'
      - '.github/workflows/**'

# On main each run ends, and only the newest waiting commit runs next.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A trigger path filter leaves a required check pending, and a skipped one passes. So
  # `test` skips only when this filter ran and found no change. A merge queue push skips
  # `test`, because the queue already ran it on the same commit.
  changes:
    if: github.event_name != 'push' || github.actor == 'github-merge-queue[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name == 'push' && 'false' || steps.filter.outputs.code }}
    steps:
      # In the merge queue, the filter diffs the group's base and head in a clone.
      - if: github.event_name == 'merge_group'
        uses: actions/checkout@v4
      - if: github.event_name != 'push'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          base: ${{ github.event.merge_group.base_sha }}
          ref: ${{ github.event.merge_group.head_sha }}
          filters: |
            code:
              - 'crates/**'
              - 'bench/**'
              - 'fuzz/**'
              - 'xtask/**'
              - 'oracles/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'clippy.toml'
              - 'rustfmt.toml'
              - 'deny.toml'
              - '.github/workflows/**'

  test:
    needs: changes
    if: "!cancelled() && needs.changes.outputs.code != 'false'"
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      # A cancelled or killed run of cargo mutants leaves its copies in /tmp, on a disk
      # that the runners of a host share. The mutants job times out after 90 minutes,
      # so no job still uses a copy older than 120.
      - name: Remove old copies of cargo mutants
        run: |
          df -h /
          du -sh /tmp/cargo-mutants-* "$HOME"/target/* 2>/dev/null || true
          find /tmp -maxdepth 1 -name 'cargo-mutants-*' -mmin +120 -exec rm -rf {} +
      - uses: actions/checkout@v4
      - name: Add cargo to the path
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # Outside the workspace, so checkout keeps it. One job runs on a runner at a
      # time, so each runner owns its directory.
      - name: Keep the build
        run: |
          dir="$HOME/target/$RUNNER_NAME"
          if [ -d "$dir" ] && [ "$(du -sk "$dir" | cut -f1)" -gt $((25 * 1024 * 1024)) ]
          then
            rm -rf "$dir"
          fi
          echo "CARGO_TARGET_DIR=$dir" >> "$GITHUB_ENV"
      - name: Test
        run: cargo test --workspace
