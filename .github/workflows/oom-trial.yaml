name: OOM trial

# Temporary: does a scope with no OOMPolicy stop its other processes when the kernel
# kills one?
on:
  pull_request:

jobs:
  trial:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: The scope of the mutants shards, with and without OOMPolicy=continue
        run: |
          systemctl --version | head -1
          systemctl show -p DefaultOOMPolicy
          cap=$(( $(awk '/^MemTotal:/ {print $2}' /proc/meminfo) - 3145728 ))K
          for policy in default continue; do
            extra=()
            [ "$policy" = continue ] && extra=(-p OOMPolicy=continue)
            status=0
            sudo -E systemd-run --quiet --scope -p MemoryMax="$cap" -p MemorySwapMax=0 \
              "${extra[@]}" --uid="$(id -u)" --gid="$(id -g)" -- env "PATH=$PATH" \
              bash -c 'python3 -c "b = []
          while True: b.append(bytes(range(256)) * (1 << 18))"
              echo "OOMPolicy $0: the parent went on after the child ended with $?"' \
              "$policy" || status=$?
            echo "OOMPolicy $policy: systemd-run ended with $status"
          done
