              - rig::a_failed_kill_while_the_test_panics_reports_its_error # #3034
              - rig::a_failed_kill_panics_in_a_run_that_does_not_capture # #3034
              - one_node::sim::a_stopped_influx_refuses_and_serves_again_on_its_port_with_what_it_stored # #3035
              - one_node::sim::a_dropped_opcua_stops_each_server_that_it_served # #3035
              - one_node::sim::a_dropped_influx_stops_its_server_when_the_test_panics # #3035
              - one_node::a_wrong_endpoint_shows_in_status_and_heals # #3035
              - no_child_holds_a_socket_that_another_thread_opens # #3036
              - no_child_holds_a_socket_of_a_lookup # #3036
              - a_dropped_listener_refuses_while_a_copy_of_it_is_open # #3036
              - a_listener_with_a_failed_registration_refuses_while_a_copy_is_open # #3036
              - start::a_kept_pool_budget_too_large_for_the_host_fails_with_no_panic # #3043
              - start::a_kept_pool_budget_that_the_system_cannot_reserve_fails # #3043
              - open62541::tests::check_refuses_a_line_directive_in_the_copy # #3041
