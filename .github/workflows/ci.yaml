              - xtask/src/open62541.rs tests::check_fails_a_read_of_aws_lc_with_no_declaration # #3166
              - xtask/src/open62541.rs tests::check_fails_a_read_of_the_copy_with_no_declaration # #3166
              - xtask/src/open62541.rs tests::check_finds_a_read_of_the_committed_copy_that_gives_aws_lc_no_callback # #3166
              - xtask/src/open62541.rs tests::check_finds_a_read_of_the_copy_with_its_own_declaration # #3166
              - xtask/src/open62541.rs tests::check_finds_a_read_past_a_pem_h_of_the_copy # #3166
              - xtask/src/open62541.rs tests::check_finds_a_read_under_a_macro_of_pem_h # #3166
              - xtask/src/open62541.rs tests::check_passes_on_the_committed_copy # #3166
              - xtask/src/open62541.rs tests::check_refuses_a_cc_that_is_not_gcc # #3166
              - xtask/src/open62541.rs tests::check_runs_each_tool_in_the_c_locale # #3166
              - xtask/src/open62541.rs tests::each_thread_of_the_committed_copy_draws_from_its_own_random_state_or_aborts # #3166
    runs-on: ${{ matrix.runner }}
    env:
      RUST: ${{ needs.changes.outputs.rust }}
    defaults:
      run:
        shell: bash
    steps:
      - if: env.RUST != 'false'
        uses: actions/checkout@v4
      - if: env.RUST != 'false'
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.part }}
      - if: env.RUST != 'false' && matrix.part == 'test'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      # The tests of `sdk-python` embed CPython 3.11 or later, which needs its shared
      # library and NumPy, and start the node at `FOUNDATION_NODE`, which `Test` builds
      # for the tests of `node`. Windows builds no node (#2968, #682, #2955, #2956,
      # #477, #2957). NumPy 2.4.6 is the last release for Python 3.11.
      - if: env.RUST != 'false' && runner.os != 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: env.RUST != 'false' && runner.os != 'Windows'
        run: |
          python -m pip install numpy==2.4.6
          echo "PYO3_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "FOUNDATION_NODE=$PWD/target/debug/foundation" >> "$GITHUB_ENV"
      - name: Format
        if: env.RUST != 'false' && matrix.part == 'lint' && runner.os == 'Linux'
        run: |
          cargo fmt --check
          cargo fmt --check --manifest-path fuzz/Cargo.toml
      - name: Clippy
        if: "!cancelled() && env.RUST != 'false' && matrix.part == 'lint'"
        run: >-
          cargo clippy --workspace ${{ join(matrix.crates, ' ') }} --all-targets
          --all-features --keep-going -- -D warnings
      - name: Layers
        if: >-
          !cancelled() && env.RUST != 'false' && matrix.part == 'lint'
          && runner.os == 'Linux'
        run: cargo xtask layers
      - name: Globals
        if: >-
          !cancelled() && env.RUST != 'false' && matrix.part == 'lint'
          && runner.os == 'Linux'
        run: cargo xtask globals
      - name: Skips
        if: >-
          !cancelled() && env.RUST != 'false' && matrix.part == 'lint'
          && runner.os == 'Linux'
        run: cargo xtask skips
      - name: Oracles
        if: >-
          !cancelled() && env.RUST != 'false' && matrix.part == 'lint'
          && runner.os == 'Linux'
        run: cargo xtask oracles
      - name: Test
        if: "!cancelled() && env.RUST != 'false' && matrix.part == 'test'"
        env:
          SKIPPED: ${{ join(matrix.tests, ' ') }}
        run: >-
          scripts/test.sh nextest ${{ join(matrix.crates, ' ') }}
          ${{ join(matrix.untested, ' ') }} --all-features
      - name: Serial tests
        if: "!cancelled() && env.RUST != 'false' && matrix.part == 'serial'"
        run: >-
          scripts/test.sh serial ${{ join(matrix.crates, ' ') }}
          ${{ join(matrix.untested, ' ') }} --all-features
      # Root tests mount a filesystem. Only this runner, which is discarded after the
      # job, runs them.
      - name: Root tests
        if: >-
          !cancelled() && env.RUST != 'false' && matrix.part == 'test'
          && runner.os == 'Linux'
        run: |
          cargo clippy -p os --all-features --test root -- -D warnings
          cargo test -p os --all-features --test root

  # The required checks `check`, `macos`, and `windows`. Each passes when each part of
  # `check` passed: the result of a matrix job covers all its entries. `check` always
  # runs, so with no change of code each part passes, and so does `os`.
  os:
    needs: check
    if: "!cancelled()"
    name: ${{ matrix.name }}
    strategy:
      matrix:
        name: [check, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - name: The result of the parts
        env:
          RESULT: ${{ needs.check.result }}
        run: |
          [ "$RESULT" = success ] ||
            { echo "::error::The lint and test parts ended in $RESULT."; exit 1; }

  # The required checks `features`, `features-macos`, and `features-windows`. It runs
  # as `check` does, and each OS leaves out the `crates` of its entry of `check`.
  features:
    needs: changes
    if: "!cancelled()"
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: features
            runner: ubuntu-24.04
            crates: []
          - name: features-macos
            runner: macos-15
            crates: []
          - name: features-windows
            runner: windows-2025
            crates:
              - --exclude connector-opcua # #2968
              - --exclude node # #2968, #682, #2955, #2956, #477, #2957
              - --exclude acceptance # #2968, #682, #2955, #2956, #477, #2957
              - --exclude ops # #2971
              - --exclude sdk # #682, #2955, #2956, #3294
              - --exclude sdk-python # #682, #2955, #2956, #2968, #477, #2957, #3298
    runs-on: ${{ matrix.runner }}
    env:
      RUST: ${{ needs.changes.outputs.rust }}
    defaults:
      run:
        shell: bash
    steps:
      - if: env.RUST != 'false'
        uses: actions/checkout@v4
      - if: env.RUST != 'false'
        uses: Swatinem/rust-cache@v2
      - if: env.RUST != 'false'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack@0.6.45
      - name: Each feature alone
        if: env.RUST != 'false'
        run: >-
          cargo hack check --workspace ${{ join(matrix.crates, ' ') }} --each-feature
          --no-dev-deps

  deny:
    needs: changes
    if: "!cancelled() && needs.changes.outputs.deps != 'false'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      # `fuzz/` is a workspace of its own, with its own lock file.
      - name: Dependencies
        run: |
          cargo deny check advisories bans licenses sources
          cargo deny --manifest-path fuzz/Cargo.toml \
            check advisories bans licenses sources
      # A patched crate is a path package, which no advisory reaches. A package that
      # depends on the exact release of each path package outside the workspace
      # checks those releases.
      - name: Advisories of each patched release
        shell: bash
        run: |
          dir="$RUNNER_TEMP/patched"
          mkdir -p "$dir/src" && touch "$dir/src/lib.rs"
          {
            printf '[package]\nname = "patched"\nversion = "0.0.0"\nedition = "2024"\n'
            printf '\n[workspace]\n\n[dependencies]\n'
            cargo metadata --format-version 1 --locked | jq -r '.workspace_members as $m
              | .packages[] | select(.source == null and (.id | IN($m[]) | not))
              | "\(.name) = \"=\(.version)\""'
          } > "$dir/Cargo.toml"
          cargo deny --manifest-path "$dir/Cargo.toml" --config deny.toml \
            check advisories

  wait:
    needs: changes
    if: "!cancelled() && needs.changes.outputs.wait != 'false'"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      # The last cases read merged #1428 through the API.
      - name: Wait script
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .claude/skills/build/wait_test.sh

  loom:
    needs: changes
    if: "!cancelled() && needs.changes.outputs.models != 'false'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p ring -p block --all-targets -- -D warnings
        env:
          RUSTFLAGS: --cfg loom
      - name: Loom
        run: cargo xtask loom

  shuttle:
    needs: changes
    if: "!cancelled() && needs.changes.outputs.models != 'false'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Shuttle
        run: cargo xtask shuttle

  # Each shard runs an eighth of the Miri tests.
  miri-shard:
    needs: changes
    if: "!cancelled() && needs.changes.outputs.models != 'false'"
    name: miri shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned nightly
        run: |
          rustup toolchain install "$(cat rust-toolchain-nightly)" --profile minimal \
            --component miri,rust-src
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - uses: Swatinem/rust-cache@v2
      - name: Miri
        env:
          SHARD: ${{ matrix.shard }}
        run: cargo xtask miri "$SHARD/8"

  # The required check. It passes when each shard passed.
  miri:
    needs: [changes, miri-shard]
    if: "!cancelled() && needs.changes.outputs.models != 'false'"
    runs-on: ubuntu-24.04
    steps:
      - name: The result of the shards
        env:
          RESULT: ${{ needs.miri-shard.result }}
        run: |
          [ "$RESULT" = success ] ||
            { echo "::error::The miri shards ended in $RESULT."; exit 1; }

  # Miri cannot run C, so ASan and UBSan check `connector-opcua` in its place.
  sanitizers:
    needs: changes
    if: "!cancelled() && needs.changes.outputs.rust != 'false'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned nightly
        run: |
          rustup toolchain install "$(cat rust-toolchain-nightly)" --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Sanitizers
        run: cargo xtask sanitizers

  fuzz:
    needs: changes
    if: "!cancelled() && needs.changes.outputs.rust != 'false'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned nightly
        run: |
          rustup toolchain install "$(cat rust-toolchain-nightly)" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            fuzz -> target
      - name: Read the cargo-fuzz pin
        id: cargo-fuzz
        run: echo "tool=cargo-fuzz@$(cat fuzz/cargo-fuzz-version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: ${{ steps.cargo-fuzz.outputs.tool }}
      # `fuzz/` is a workspace of its own, which the Clippy step of `check` does not
      # see.
      - name: Clippy
        run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
      - name: Fuzz
        if: ${{ !cancelled() }}
        run: cargo xtask fuzz 60
      - name: Clean tree
        run: test -z "$(git status --porcelain)" || { git status; exit 1; }
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  mutants-shard:
    needs: changes
    if: >-
      !cancelled() && needs.changes.outputs.rust != 'false' &&
      github.event_name == 'pull_request'
    # A mutant that hangs runs until its timeout, so the run needs parallel jobs. Each
    # shard runs an eighth of the mutants, round robin, on its own hosted 4-core VM,
    # which no other job shares (#2726). The rule that a missed mutant fails CI is in
    # `docs/claude/testing.md`.
    name: mutants shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
        with:
          # cargo-mutants builds in copies of the tree, never in its `target`.
          cache-targets: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      # As in `check`. cargo-mutants runs only the tests of the mutated crate, so only a
      # shard with a mutant in `sdk/python` builds the node.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Node
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          git diff origin/main...HEAD > "$RUNNER_TEMP/diff.patch"
          python -m pip install numpy==2.4.6
          echo "PYO3_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "FOUNDATION_NODE=$PWD/target/debug/foundation" >> "$GITHUB_ENV"
          mutants=$(cargo mutants --in-diff "$RUNNER_TEMP/diff.patch" --list \
            --shard "$SHARD/8" --sharding round-robin)
          if printf '%s\n' "$mutants" | grep -q '^sdk/python/'; then
            cargo build -p node --bin foundation
          fi
      - name: Mutants in the diff
        env:
          TMPDIR: ${{ runner.temp }}
          SHARD: ${{ matrix.shard }}
        run: |
          # A mutant can allocate in a loop. The cap leaves 3 GiB of the VM to the
          # runner agent, so the kernel kills the test, and the job reports the mutant.
          # The default OOMPolicy=stop would also stop cargo-mutants at that kill. A
          # hang waits 3 times the test time of the baseline, not the default 5: 4 jobs
          # on 4 cores can run slower than the baseline, so not lower. sudo drops
          # LD_LIBRARY_PATH, which the embedded CPython needs.
          cap=$(( $(awk '/^MemTotal:/ {print $2}' /proc/meminfo) - 3145728 ))K
          status=0
          sudo -E systemd-run --quiet --scope -p MemoryMax="$cap" -p MemorySwapMax=0 \
            -p OOMPolicy=continue --uid="$(id -u)" --gid="$(id -g)" -- \
            env "PATH=$PATH" "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" \
            cargo mutants --in-diff "$RUNNER_TEMP/diff.patch" --jobs 4 \
            --shard "$SHARD/8" --sharding round-robin --timeout-multiplier 3 ||
            status=$?
          # A timeout is a mutant that made a test hang, so a test caught it. Exit 3
          # (timeout) wins over exit 2 (missed), so read the missed list too.
          if [ "$status" -eq 3 ] && [ ! -s mutants.out/missed.txt ]; then
            cat mutants.out/timeout.txt
            status=0
          fi
          exit "$status"

  # The required check. On a PR it passes when each shard passed. In the queue no shard
  # runs: it carries the result of this job at the head of the PR to the group.
  mutants:
    needs: [changes, mutants-shard]
    if: >-
      !cancelled() && needs.changes.outputs.rust != 'false' &&
      (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      checks: read
    steps:
      - if: github.event_name == 'pull_request'
        name: The result of the shards
        env:
          RESULT: ${{ needs.mutants-shard.result }}
        run: |
          [ "$RESULT" = success ] ||
            { echo "::error::The mutants shards ended in $RESULT."; exit 1; }
      - if: github.event_name == 'merge_group'
        uses: actions/checkout@v4
        with:
          # The check that runs is the one on the default branch, never the PR's.
          ref: ${{ github.event.repository.default_branch }}
      - if: github.event_name == 'merge_group'
        uses: Swatinem/rust-cache@v2
      - if: github.event_name == 'merge_group'
        name: The mutants result at the head of the PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GROUP: ${{ github.event.merge_group.head_sha }}
        run: cargo xtask queue mutants "$GROUP"
