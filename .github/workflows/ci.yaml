name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Layers
        run: cargo xtask layers
      - name: Test
        run: cargo test --workspace

  loom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p ring -p block --all-targets -- -D warnings
        env:
          RUSTFLAGS: --cfg loom
      - name: Model tests
        run: cargo test -p ring -p block --lib --release
        env:
          RUSTFLAGS: --cfg loom

  miri:
    runs-on: ubuntu-latest
    env:
      NIGHTLY: nightly-2026-10-01
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned nightly
        run: rustup toolchain install "$NIGHTLY" --component miri
      - name: Miri
        run: cargo "+$NIGHTLY" miri test -p ring -p block
