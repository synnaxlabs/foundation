name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'bench/**'
      - 'fuzz/**'
      - 'xtask/**'
      - 'oracles/**'
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain*'
      - 'clippy.toml'
      - 'rustfmt.toml'
      - 'deny.toml'
      - '.github/workflows/**'

# Each commit on main gets its own group, so a later merge never cancels its run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # A skipped required job counts as passed. So a job skips only when this filter ran
  # and found no change. A direct push or a failed filter runs every job. A merge queue
  # push skips every job, because the queue already ran them on the same commit.
  changes:
    if: github.event_name != 'push' || github.actor == 'github-merge-queue[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: >-
        ${{ github.event_name == 'push' && 'false' || steps.filter.outputs.rust }}
      deps: >-
        ${{ github.event_name == 'push' && 'false' || steps.filter.outputs.deps }}
      models: >-
        ${{ github.event_name == 'push' && 'false' || steps.filter.outputs.models }}
    steps:
      # In the merge queue, the filter diffs the group's base and head in a clone.
      - if: github.event_name == 'merge_group'
        uses: actions/checkout@v4
      - if: github.event_name != 'push'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          base: ${{ github.event.merge_group.base_sha }}
          ref: ${{ github.event.merge_group.head_sha }}
          filters: |
            rust:
              - 'crates/**'
              - 'bench/**'
              - 'fuzz/**'
              - 'xtask/**'
              - 'oracles/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'clippy.toml'
              - 'rustfmt.toml'
              - 'deny.toml'
              - '.github/workflows/**'
            deps:
              - 'Cargo.toml'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - '.github/workflows/**'
            models:
              - 'crates/ring/**'
              - 'crates/block/**'
              - 'crates/counting/**'
              - 'crates/node/**'
              - 'crates/connector-ni/**'
              - 'crates/daqmx-stub/**'
              - 'xtask/**'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - '.github/workflows/**'

  check:
    needs: changes
    if: "!cancelled() && needs.changes.outputs.rust != 'false'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Layers
        run: cargo xtask layers
      - name: Globals
        run: cargo xtask globals
      - name: Oracles
        run: cargo xtask oracles
      - name: Test
        run: cargo test --workspace --all-features
      # Root tests mount a filesystem. Only this runner, which is discarded after the
      # job, runs them.
      - name: Root tests
        run: |
          cargo clippy -p os --all-features --test root -- -D warnings
          cargo test -p os --all-features --test root

  features:
    needs: changes
    if: "!cancelled() && needs.changes.outputs.rust != 'false'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack@0.6.45
      - name: Each feature alone
        run: cargo hack check --workspace --each-feature --no-dev-deps

  deny:
    needs: changes
    if: "!cancelled() && needs.changes.outputs.deps != 'false'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Dependencies
        run: cargo deny check advisories bans licenses sources

  loom:
    needs: changes
    if: "!cancelled() && needs.changes.outputs.models != 'false'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p ring -p block --all-targets -- -D warnings
        env:
          RUSTFLAGS: --cfg loom
      - name: Loom
        run: cargo xtask loom

  shuttle:
    needs: changes
    if: "!cancelled() && needs.changes.outputs.models != 'false'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Shuttle
        run: cargo xtask shuttle

  miri:
    needs: changes
    if: "!cancelled() && needs.changes.outputs.models != 'false'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned nightly
        run: |
          rustup toolchain install "$(cat rust-toolchain-nightly)" --profile minimal \
            --component miri,rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Miri
        run: cargo xtask miri

  mutants:
    needs: changes
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      needs.changes.outputs.rust != 'false'
    # A mutant that hangs runs until its timeout, so the run needs parallel jobs and
    # memory that the 2-core hosted runner lacks.
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 90
    steps:
      # A mutant can allocate in a loop until the host runs out of memory. The cgroup
      # of the runner unit caps the job, so only a test process dies (#803). Hosts
      # whose template sets no cap: #898.
      - name: Check the memory cap of the runner
        run: |
          d=/sys/fs/cgroup$(cut -d: -f3 /proc/self/cgroup)
          while [ "$d" != /sys/fs/cgroup ]; do
            m=$(cat "$d/memory.max" 2>/dev/null || echo max)
            [ "$m" = max ] || { echo "Memory cap $m at $d"; exit 0; }
            d=${d%/*}
          done
          echo "::error::The runner has no memory cap (#803, #898)."
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add cargo to the path
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Mutants in the diff
        run: |
          git diff origin/main...HEAD > "$RUNNER_TEMP/diff.patch"
          status=0
          cargo mutants --in-diff "$RUNNER_TEMP/diff.patch" --jobs 4 || status=$?
          # A timeout is a mutant that made a test hang, so a test caught it. Exit 3
          # (timeout) wins over exit 2 (missed), so read the missed list too.
          if [ "$status" -eq 3 ] && [ ! -s mutants.out/missed.txt ]; then
            cat mutants.out/timeout.txt
            status=0
          fi
          exit "$status"
