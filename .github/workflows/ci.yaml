name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'bench/**'
      - 'fuzz/**'
      - 'xtask/**'
      - 'sdk/**'
      - 'oracles/**'
      - 'patches/**'
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain*'
      - 'clippy.toml'
      - 'rustfmt.toml'
      - 'deny.toml'
      - 'docs/quickstart.md'
      - '.github/workflows/**'

# Each commit on main gets its own group, so a later merge never cancels its run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  # A skipped required job counts as passed. So a job skips only when this filter ran
  # and found no change. A direct push or a failed filter runs every job. A merge queue
  # push skips every job, because the queue already ran them on the same commit.
  changes:
    if: github.event_name != 'push' || github.actor == 'github-merge-queue[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: >-
        ${{ github.event_name == 'push' && 'false' || steps.filter.outputs.rust }}
      deps: >-
        ${{ github.event_name == 'push' && 'false' || steps.filter.outputs.deps }}
      models: >-
        ${{ github.event_name == 'push' && 'false' || steps.filter.outputs.models }}
      wait: >-
        ${{ github.event_name == 'push' && 'false' || steps.filter.outputs.wait }}
    steps:
      # In the merge queue, the filter diffs the group's base and head in a clone.
      - if: github.event_name == 'merge_group'
        uses: actions/checkout@v4
      - if: github.event_name != 'push'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          base: ${{ github.event.merge_group.base_sha }}
          ref: ${{ github.event.merge_group.head_sha }}
          filters: |
            rust:
              - 'crates/**'
              - 'bench/**'
              - 'fuzz/**'
              - 'xtask/**'
              - 'sdk/**'
              - 'oracles/**'
              - 'patches/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'clippy.toml'
              - 'rustfmt.toml'
              - 'deny.toml'
              - 'docs/quickstart.md'
              - '.github/workflows/**'
            deps:
              - 'Cargo.toml'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'fuzz/Cargo.lock'
              - 'deny.toml'
              - '.github/workflows/**'
            models:
              - 'crates/ring/**'
              - 'crates/block/**'
              - 'crates/counting/**'
              - 'crates/waker/**'
              - 'crates/env/**'
              - 'crates/types/**'
              - 'crates/node/**'
              - 'crates/connector/**'
              - 'crates/connector-ni/**'
              - 'crates/daqmx-stub/**'
              - 'xtask/**'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - '.github/workflows/**'
            wait:
              - '.claude/skills/build/wait.sh'
              - '.claude/skills/build/wait_test.sh'
              - '.github/workflows/**'

  # The lint and the two parts of the tests (`scripts/test.sh`) of each OS of LINUX CI,
  # at the same time. A matrix job that skips reports one check named by the
  # unexpanded expression, so this job always runs, and each step skips when the
  # filter found no change.
  check:
    needs: changes
    if: "!cancelled()"
    name: ${{ matrix.part }} ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        name: [check, macos, windows]
        part: [lint, test, serial]
        # Each OS lists the flags that leave out what fails on it, each with the open
        # issue that removes it: `crates` do not build with all their targets, the tests
        # of `untested` fail, and so do `tests`, each a full test path that nextest
        # matches with `test(=<path>)`. Each item of `gates` names a file and the path
        # in it of an item whose `cfg` leaves a test out of the OS, which `cargo xtask
        # skips` reads. The lists only shrink, other than a new crate or gate with the
        # open issues of the `os` items that it needs (LINUX CI).
        include:
          - name: check
            runner: ubuntu-24.04
            crates: []
            untested: []
            tests: []
            gates: []
          - name: macos
            runner: macos-15
            crates: []
            untested: []
            tests:
              - wall::gives_a_bound_under_sixteen_seconds_when_a_daemon_runs # #2965
              - daqmx::tests::names_a_library_that_does_not_load # #3033
